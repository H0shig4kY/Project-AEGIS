[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-pentest"
version = "0.1.0"
description = "Modular open-source framework for authorized security assessments"
requires-python = ">=3.12"

dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[project.scripts]
aegis = "aegis.cli:app"